name: Parish Web CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: parish-web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.PUBLIC_API_URL || 'https://api.hyvongofficial.online' }}/api/v1
          VITE_SITE_URL: ${{ vars.PUBLIC_WEB_URL || 'https://giaoxu.hyvongofficial.online' }}
      - run: node --test deploy/manual/tests/check.mjs
      - run: npm audit --omit=dev --audit-level=high
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Package manual static release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          tar -czf "ducmy-web-${GITHUB_SHA}.tar.gz" -C dist .
          sha256sum "ducmy-web-${GITHUB_SHA}.tar.gz" > "ducmy-web-${GITHUB_SHA}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: ducmy-web-${{ github.sha }}
          path: |
            ducmy-web-${{ github.sha }}.tar.gz
            ducmy-web-${{ github.sha }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
