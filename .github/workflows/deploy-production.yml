name: Parish Web production deploy

on:
  workflow_run:
    workflows: [Parish Web CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: parish-web-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.PRODUCTION_DEPLOY_ENABLED == 'true' &&
      vars.PRODUCTION_READINESS_CONFIRMED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Verify this is still the latest main commit
        shell: bash
        run: |
          git fetch origin main --depth=1
          test "$(git rev-parse FETCH_HEAD)" = "${{ github.event.workflow_run.head_sha }}"
      - name: Normalize GHCR image owner
        shell: bash
        run: echo "IMAGE_REPO=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/duc-my-parish-web" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.PUBLIC_API_URL || 'https://api.hyvongofficial.online' }}/api/v1
          VITE_SITE_URL: ${{ vars.PUBLIC_WEB_URL || 'https://giaoxu.hyvongofficial.online' }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_API_URL=${{ vars.PUBLIC_API_URL || 'https://api.hyvongofficial.online' }}/api/v1
            VITE_SITE_URL=${{ vars.PUBLIC_WEB_URL || 'https://giaoxu.hyvongofficial.online' }}
          tags: ${{ env.IMAGE_REPO }}:production-${{ github.event.workflow_run.head_sha }}
      - name: Recheck main before deployment
        shell: bash
        run: |
          git fetch origin main --depth=1
          test "$(git rev-parse FETCH_HEAD)" = "${{ github.event.workflow_run.head_sha }}"
      - name: Require pinned VPS host key
        shell: bash
        env:
          VPS_HOST_FINGERPRINT: ${{ secrets.VPS_HOST_FINGERPRINT }}
        run: test -n "$VPS_HOST_FINGERPRINT"
      - uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          script: |
            set -eu
            cd "${{ vars.PRODUCTION_DEPLOY_PATH }}"
            export WEB_IMAGE="${{ env.IMAGE_REPO }}:production-${{ github.event.workflow_run.head_sha }}"
            ./scripts/deploy.sh .env.production
